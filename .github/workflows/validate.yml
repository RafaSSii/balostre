name: Validate game rules and server

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        run: npm install
      - name: Run game-rules tests
        run: npm test
      - name: Check server JavaScript syntax
        run: |
          node --check apps/server/src/index.js
          node --check apps/server/src/rooms/WorldRoom.js
